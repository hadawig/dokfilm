# GitHub Actions Workflow für das automatische Deployment von VitePress auf GitHub Pages
name: Deploy VitePress site to Pages

on:
  push:
    branches: [main] # Führt den Workflow bei jedem Push auf den main-Branch aus

  # Erlaubt das manuelle Starten des Workflows über das "Actions" Tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Stellt sicher, dass nur ein Deployment gleichzeitig läuft
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build with VitePress
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
