<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Hintergrund -->
  <rect width="800" height="450" fill="#f4f4f4"/>
  
  <!-- Linke Seite: Dr. Christa Scharf (Präzision) -->
  <rect x="0" y="0" width="400" height="450" fill="#ffffff"/>
  <text x="200" y="100" font-family="Serif" font-size="24" text-anchor="middle" fill="#333">QUALIFIKATION</text>
  <text x="200" y="220" font-family="Serif" font-size="120" font-weight="bold" text-anchor="middle" fill="#004d00">98</text>
  <text x="200" y="260" font-family="Serif" font-size="20" text-anchor="middle" fill="#666">PUNKTE (HEARING)</text>
  <text x="200" y="380" font-family="Serif" font-size="18" font-style="italic" text-anchor="middle" fill="#333">"Ein Finanzamt ist kein Taschenrechner?"</text>
  
  <!-- Trennlinie / Abgrund -->
  <line x1="400" y1="50" x2="400" y2="400" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Rechte Seite: Michael L. (Pointillismus) -->
  <rect x="400" y="0" width="400" height="450" fill="#1a1a1a"/>
  
  <!-- Pointillistische Punkte im Hintergrund rechts -->
  <circle cx="500" cy="150" r="3" fill="#ffd700" opacity="0.6"/>
  <circle cx="550" cy="120" r="4" fill="#ffd700" opacity="0.4"/>
  <circle cx="620" cy="180" r="2" fill="#ffd700" opacity="0.7"/>
  <circle cx="680" cy="100" r="5" fill="#ffd700" opacity="0.3"/>
  <circle cx="720" cy="250" r="3" fill="#ffd700" opacity="0.5"/>
  <circle cx="450" cy="300" r="4" fill="#ffd700" opacity="0.4"/>
  
  <text x="600" y="100" font-family="Sans-Serif" font-size="24" text-anchor="middle" fill="#eee">LOYALITÄT</text>
  <!-- Verschwommener Effekt für die 62 -->
  <text x="600" y="220" font-family="Sans-Serif" font-size="120" font-weight="bold" text-anchor="middle" fill="#ffd700" style="filter: blur(2px);">62</text>
  <text x="600" y="260" font-family="Sans-Serif" font-size="20" text-anchor="middle" fill="#aaa">PUNKTE (INTERVENTION)</text>
  <text x="600" y="380" font-family="Sans-Serif" font-size="18" font-style="italic" text-anchor="middle" fill="#eee">"Gespür für die Leut'"</text>
  
  <!-- Footer Slogan -->
  <rect x="0" y="410" width="800" height="40" fill="#cc0000"/>
  <text x="400" y="435" font-family="Sans-Serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">DER 36-PUNKTE-ABGRUND: "CHEF, BITTE ANSCHAUN."</text>
</svg>
