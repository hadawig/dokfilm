<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (Transparent for T-Shirts) -->
  <rect width="800" height="800" fill="none" />
  
  <!-- Stylized Grand Piano (Flügel) -->
  <path d="M200 450 L200 300 C200 200 350 150 500 150 L600 150 L600 450 Z" fill="#000" stroke="#d4af37" stroke-width="5" />
  
  <!-- Golden Keys -->
  <rect x="210" y="420" width="380" height="20" fill="#d4af37" />
  <line x1="240" y1="420" x2="240" y2="440" stroke="#000" stroke-width="2" />
  <line x1="270" y1="420" x2="270" y2="440" stroke="#000" stroke-width="2" />
  <line x1="300" y1="420" x2="300" y2="440" stroke="#000" stroke-width="2" />
  <line x1="330" y1="420" x2="330" y2="440" stroke="#000" stroke-width="2" />
  <line x1="360" y1="420" x2="360" y2="440" stroke="#000" stroke-width="2" />
  <line x1="390" y1="420" x2="390" y2="440" stroke="#000" stroke-width="2" />
  <line x1="420" y1="420" x2="420" y2="440" stroke="#000" stroke-width="2" />
  
  <!-- Text Elements -->
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="40" fill="#d4af37" font-weight="bold" text-anchor="middle">DIE ÄSTHETIK DES DEFIZITS</text>
  
  <text x="400" y="550" font-family="Courier, monospace" font-size="28" fill="#fff" font-weight="bold" text-anchor="middle">SOBOTKA ORGEL-EDITION</text>
  <text x="400" y="590" font-family="Courier, monospace" font-size="18" fill="#888" text-anchor="middle">PARLAMENTARISCHER MIET-KLASSIKER</text>
  
  <!-- Redacted Stamp look -->
  <g transform="rotate(-10 600 300)">
    <rect x="500" y="250" width="180" height="60" rx="5" fill="none" stroke="#cc0000" stroke-width="4" opacity="0.7" />
    <text x="590" y="290" font-family="Arial, sans-serif" font-size="24" fill="#cc0000" font-weight="bold" text-anchor="middle" opacity="0.7">ABGEDREHT</text>
  </g>
  
  <!-- Pointillism Dots around -->
  <circle cx="150" cy="200" r="5" fill="#d4af37" opacity="0.5" />
  <circle cx="180" cy="180" r="3" fill="#d4af37" opacity="0.3" />
  <circle cx="650" cy="400" r="6" fill="#d4af37" opacity="0.4" />
  <circle cx="620" cy="450" r="4" fill="#d4af37" opacity="0.2" />
</svg>
