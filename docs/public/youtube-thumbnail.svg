<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1280" height="720" fill="#050505" />
  
  <!-- Pointillism Overlay -->
  <circle cx="100" cy="100" r="2" fill="#d4af37" opacity="0.3" />
  <circle cx="1100" cy="600" r="3" fill="#d4af37" opacity="0.4" />
  <circle cx="200" cy="500" r="1.5" fill="#d4af37" opacity="0.2" />
  <circle cx="900" cy="150" r="2.5" fill="#d4af37" opacity="0.5" />
  
  <!-- Glowing Center Effect -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#d4af37; stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#050505; stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#glow)" />

  <!-- Main Title -->
  <text x="640" y="300" font-family="Arial Black, sans-serif" font-size="120" fill="#d4af37" text-anchor="middle" font-weight="900" style="filter: drop-shadow(0 0 20px rgba(212,175,55,0.8));">GEMINI AND I</text>
  
  <!-- Subtitle -->
  <text x="640" y="420" font-family="Courier New, monospace" font-size="45" fill="#fff" text-anchor="middle" font-weight="bold">DAS HORTEN-MYSTERIUM</text>
  
  <!-- Bottom Text Bar -->
  <rect x="0" y="600" width="1280" height="120" fill="#cc0000" />
  <text x="640" y="680" font-family="Arial, sans-serif" font-size="50" fill="#fff" text-anchor="middle" font-weight="bold" letter-spacing="5">LIVE AUS DER FORENSIK</text>

  <!-- Leaked Stamp -->
  <g transform="rotate(-15 200 200)">
    <rect x="50" y="50" width="350" height="120" rx="15" fill="none" stroke="#cc0000" stroke-width="10" opacity="0.9" />
    <text x="225" y="135" font-family="Arial, sans-serif" font-size="70" fill="#cc0000" font-weight="bold" text-anchor="middle" opacity="0.9">GELEAKT</text>
  </g>

  <!-- AI Brain / Chip Icon (Simplified) -->
  <path d="M1050 250 L1150 250 L1150 350 L1050 350 Z" fill="none" stroke="#d4af37" stroke-width="5" />
  <circle cx="1100" cy="300" r="30" fill="#d4af37" opacity="0.8" />
  <line x1="1100" y1="220" x2="1100" y2="250" stroke="#d4af37" stroke-width="3" />
  <line x1="1100" y1="350" x2="1100" y2="380" stroke="#d4af37" stroke-width="3" />
  <line x1="1020" y1="300" x2="1050" y2="300" stroke="#d4af37" stroke-width="3" />
  <line x1="1150" y1="300" x2="1180" y2="300" stroke="#d4af37" stroke-width="3" />
</svg>
